<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>PodPrô – Concursos de Educação</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:#F0C878;color:#2A1000}
#root{height:100%;display:flex;flex-direction:column}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ── Variables ─────────────────────────────────────────────────────────── */
:root{
  --bg:#F0C878;
  --card-bg:rgba(255,255,255,.93);
  --nav-bg:rgba(18,6,0,.88);
  --text:#1A0800;
  --text-sec:rgba(26,8,0,.65);
  --text-muted:rgba(26,8,0,.42);
  --border:rgba(26,8,0,.1);
  --inp-bg:rgba(26,8,0,.05);
  --chip-bg:rgba(26,8,0,.08);
  --ghost-bg:rgba(26,8,0,.06);
  --shadow:0 8px 32px rgba(26,8,0,.12),0 2px 8px rgba(26,8,0,.06);
  --pink:#D4207A;
  --pink-soft:rgba(212,32,122,.12);
  --overlay:rgba(26,8,0,.55);
}
.dark{
  --bg:#0A0200;
  --card-bg:rgba(255,255,255,.07);
  --nav-bg:rgba(8,2,0,.92);
  --text:#F5E4C0;
  --text-sec:rgba(245,228,192,.8);
  --text-muted:rgba(245,228,192,.5);
  --border:rgba(245,220,175,.13);
  --inp-bg:rgba(245,228,192,.07);
  --chip-bg:rgba(245,228,192,.1);
  --ghost-bg:rgba(245,228,192,.07);
  --shadow:0 8px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
  --pink:#F0428E;
  --pink-soft:rgba(240,66,142,.14);
  --overlay:rgba(0,0,0,.7);
}

/* ── Aurora Background ─────────────────────────────────────────────────── */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 100% 75% at 0% 0%,  rgba(212,32,122,.5)  0%,transparent 48%),
    radial-gradient(ellipse 80%  100% at 100% 100%,rgba(200,139,10,.42) 0%,transparent 48%),
    radial-gradient(ellipse 65%  55% at 50% 0%,   rgba(196,82,26,.32)  0%,transparent 46%),
    radial-gradient(ellipse 55%  65% at 5%  90%,  rgba(78,122,47,.22)  0%,transparent 42%),
    linear-gradient(160deg,#F7E088 0%,#F0C860 100%);
}
.bg::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(26,8,0,.04) 1px,transparent 1px);
  background-size:26px 26px;
}
.dark .bg{
  background:
    radial-gradient(ellipse 100% 75% at 0%   0%,   rgba(212,32,122,.35) 0%,transparent 48%),
    radial-gradient(ellipse 80%  100% at 100% 100%, rgba(200,139,10,.28) 0%,transparent 48%),
    radial-gradient(ellipse 65%  55% at 50%  0%,   rgba(196,82,26,.2)   0%,transparent 46%),
    radial-gradient(ellipse 55%  65% at 5%   90%,  rgba(78,122,47,.14)  0%,transparent 42%),
    linear-gradient(160deg,#100500 0%,#080200 100%);
}
.dark .bg::after{
  background-image:radial-gradient(rgba(245,228,192,.04) 1px,transparent 1px);
  background-size:26px 26px;
}

/* ── Screen ─────────────────────────────────────────────────────────────── */
.screen{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:52px 18px 100px;-webkit-overflow-scrolling:touch}

/* ── Floating Pill Nav ─────────────────────────────────────────────────── */
.nav{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  z-index:100;
  background:var(--nav-bg);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(212,32,122,.25);
  border-radius:50px;
  display:flex;
  gap:2px;
  padding:8px;
  box-shadow:0 8px 32px rgba(0,0,0,.3),0 0 0 1px rgba(212,32,122,.08),0 0 40px rgba(212,32,122,.12);
  width:calc(100% - 32px);
  max-width:360px;
}
.nav-btn{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:7px 4px 5px;border-radius:40px;
  opacity:.45;transition:opacity .2s,background .2s,transform .2s;
}
.nav-btn.active{
  opacity:1;
  background:linear-gradient(135deg,rgba(212,32,122,.28),rgba(200,139,10,.12));
  box-shadow:0 0 16px rgba(212,32,122,.2);
  transform:translateY(-1px);
}
.nav-btn .ic{font-size:19px;transition:filter .2s}
.nav-btn.active .ic{filter:drop-shadow(0 0 6px rgba(212,32,122,.8))}
.nav-btn .lb{font-size:8px;font-weight:900;color:#F5E4C0;letter-spacing:.5px;text-transform:uppercase}
.nav-btn.active .lb{color:var(--pink)}

/* ── White Glass Card ────────────────────────────────────────────────────── */
.card{
  position:relative;
  background:var(--card-bg);
  border:1px solid rgba(255,255,255,.75);
  border-radius:20px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(26,8,0,.16)}
.dark .card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(245,224,176,.12);
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
}
.dark .card:hover{box-shadow:0 12px 40px rgba(0,0,0,.65),0 0 0 1px rgba(212,32,122,.2)}
.btn.card:active{transform:scale(.97)!important;transition:transform .1s!important}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{border:none;cursor:pointer;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;transition:transform .15s,box-shadow .15s,opacity .1s;font-size:15px}
.btn:active{transform:scale(.95);opacity:.8}
.btn-pink,.btn-yellow{background:linear-gradient(135deg,#D4207A 0%,#A8185E 100%);color:#fff;box-shadow:0 6px 22px rgba(212,32,122,.45)}
.btn-pink:hover,.btn-yellow:hover{box-shadow:0 8px 28px rgba(212,32,122,.6)}
.btn-ghost{background:var(--ghost-bg);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.2);color:#b91c1c}
.dark .btn-danger{color:#ef4444}

/* ── Input ───────────────────────────────────────────────────────────────── */
.inp{background:var(--inp-bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:15px;font-family:'Nunito',sans-serif;width:100%;outline:none;transition:border .2s,box-shadow .2s;box-sizing:border-box}
.inp::placeholder{color:var(--text-muted)}
.inp:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.inp option{background:var(--bg);color:var(--text)}
select.inp{appearance:none;-webkit-appearance:none}

/* ── Misc ────────────────────────────────────────────────────────────────── */
.tag-green{background:#16a34a;color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.tag-blue{background:#1D4ED8;color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.tag-yellow{background:#D97706;color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.chip{background:var(--chip-bg);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--text)}
.shine{background:linear-gradient(90deg,var(--pink),#C88B0A,var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end}
.modal-sheet{background:var(--card-bg);border:1px solid var(--border);border-radius:28px 28px 0 0;padding:32px 22px 50px;width:100%;animation:fadeUp .3s ease;backdrop-filter:blur(20px)}
.dark .modal-sheet{background:rgba(20,6,0,.95)}
.progress-wrap{background:var(--border);border-radius:6px;height:5px;overflow:hidden}
.progress-bar{height:100%;border-radius:6px;transition:width .4s ease}
.quiz-opt{background:var(--inp-bg);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;color:var(--text);font-size:14px;font-weight:600;width:100%;cursor:pointer;transition:background .25s,border .25s,transform .1s;font-family:'Nunito',sans-serif}
.quiz-opt:hover{border-color:var(--pink);background:var(--pink-soft);transform:translateX(4px)}
.quiz-opt.correct{background:rgba(22,163,74,.15)!important;border-color:#16a34a!important}
.quiz-opt.wrong{background:rgba(220,38,38,.12)!important;border-color:#dc2626!important}
.task-item{padding:14px 16px;display:flex;align-items:center;gap:12px;transition:opacity .2s}
.task-check{width:28px;height:28px;border-radius:50%;background:var(--ghost-bg);border:2px solid var(--border);flex-shrink:0;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.task-check.done{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:#16a34a;color:#fff}
.loader{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.fade-up{animation:fadeUp .35s ease forwards}
.spin{animation:spin .9s linear infinite;display:inline-block}
.pulse{animation:pulse 1.4s ease infinite}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:999;border-radius:40px;padding:10px 22px;font-weight:800;font-size:13px;box-shadow:0 4px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.dark .tag-green{background:#15532a}.dark .tag-blue{background:#1e3575}.dark .tag-yellow{background:#7c3d10}

/* ── Feature card colors (solid gradient) ─────────────────────────────── */
.fc-radar {background:linear-gradient(145deg,#C4521A,#8A3010)!important;border:none!important;box-shadow:0 8px 28px rgba(196,82,26,.55),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.22)!important}
.fc-quiz  {background:linear-gradient(145deg,#1B3A6B,#0F2248)!important;border:none!important;box-shadow:0 8px 28px rgba(27,58,107,.55),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)!important}
.fc-trilha{background:linear-gradient(145deg,#4E7A2F,#2C4818)!important;border:none!important;box-shadow:0 8px 28px rgba(78,122,47,.5),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)!important}
.fc-ebooks{background:linear-gradient(145deg,#B84A16,#7A2E0A)!important;border:none!important;box-shadow:0 8px 28px rgba(184,74,22,.5),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)!important}
.fc-aulas {background:linear-gradient(145deg,#B87E06,#7A5404)!important;border:none!important;box-shadow:0 8px 28px rgba(184,126,6,.5),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)!important}
.fc-sim   {background:linear-gradient(145deg,#1B6B6B,#0F4848)!important;border:none!important;box-shadow:0 8px 28px rgba(27,107,107,.5),0 2px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)!important}
.fc-locked{background:rgba(255,255,255,.55)!important;border:1.5px dashed rgba(61,26,5,.2)!important;box-shadow:0 2px 10px rgba(61,26,5,.08)!important}
.dark .fc-locked{background:rgba(245,228,192,.06)!important;border:1.5px dashed rgba(245,228,192,.12)!important}
/* hover lift on feature cards */
button.fc-radar:hover,button.fc-quiz:hover,button.fc-trilha:hover,
button.fc-ebooks:hover,button.fc-aulas:hover,button.fc-sim:hover{
  transform:translateY(-4px) scale(1.02);
  filter:brightness(1.08);
}

/* ── Auth Screen ──────────────────────────────────────────────────────────── */
.auth-screen{position:relative;overflow:hidden;padding:36px 22px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.auth-blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.auth-blob-1{width:360px;height:360px;background:rgba(212,32,122,.18);top:-100px;left:-90px}
.auth-blob-2{width:300px;height:300px;background:rgba(200,139,10,.14);bottom:-80px;right:-70px}
.auth-blob-3{width:240px;height:240px;background:rgba(196,82,26,.1);top:50%;left:50%;transform:translate(-50%,-50%)}
.dark .auth-blob-1{background:rgba(212,32,122,.26)}
.dark .auth-blob-2{background:rgba(200,139,10,.2)}
.dark .auth-blob-3{background:rgba(196,82,26,.14)}
#auth-card-inner{background:rgba(18,6,2,.72);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:28px;padding:28px 26px 24px;border:1px solid rgba(212,32,122,.22);box-shadow:0 0 0 1px rgba(200,139,10,.1),0 0 60px rgba(212,32,122,.18),0 0 120px rgba(212,32,122,.08),0 32px 80px rgba(0,0,0,.55);position:relative}
#auth-card-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,transparent,rgba(212,32,122,.7) 35%,rgba(200,139,10,.5) 65%,transparent)}
#auth-card-inner::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:28px;background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(212,32,122,.07) 0%,transparent 70%);pointer-events:none}
#authCardContainer{transform-style:preserve-3d;will-change:transform;transition:transform .5s ease}
.auth-tab-wrap{display:flex;background:rgba(0,0,0,.35);border-radius:50px;padding:3px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;border-radius:44px;transition:all .22s;color:rgba(245,228,192,.45);background:transparent}
.auth-tab.active{background:linear-gradient(135deg,#D4207A,#A8185E);color:#fff;box-shadow:0 4px 18px rgba(212,32,122,.45)}
.auth-inp{width:100%;box-sizing:border-box;background:rgba(255,255,255,.09);border:1.5px solid rgba(212,32,122,.3);border-radius:50px;padding:14px 20px;color:#F5E4C0;font-size:15px;font-family:'Nunito',sans-serif;font-weight:600;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.auth-inp::placeholder{color:rgba(245,228,192,.4);font-weight:600}
.auth-inp:focus{border-color:rgba(212,32,122,.65);box-shadow:0 0 0 3px rgba(212,32,122,.16);background:rgba(255,255,255,.13)}
.auth-inp option{background:#1C0A02;color:#F5E4C0}
select.auth-inp{appearance:none;-webkit-appearance:none}
.auth-submit{width:100%;padding:15px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;border-radius:50px;background:linear-gradient(135deg,#D4207A,#A8185E);color:#fff;box-shadow:0 6px 26px rgba(212,32,122,.5);margin-top:8px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.auth-submit:active{transform:scale(.96);box-shadow:0 2px 12px rgba(212,32,122,.3)}
body:not(.dark) #auth-card-inner{background:rgba(22,8,2,.75)}

/* ── Spotlight Glow ───────────────────────────────────────────────────────── */
[data-glow]{--base:335;--spread:90;--radius:18;--border:1.5;--size:250;--border-size:calc(var(--border)*1px);--spotlight-size:calc(var(--size)*1px);--hue:calc(var(--base)+(var(--xp,0)*var(--spread)));background-image:radial-gradient(var(--spotlight-size) var(--spotlight-size) at calc(var(--x,0)*1px) calc(var(--y,0)*1px),hsl(var(--hue) 80% 62% / .09) 0%,transparent 78%);background-color:var(--card-bg);background-size:calc(100% + 2*var(--border-size)) calc(100% + 2*var(--border-size));background-position:50% 50%;background-attachment:fixed;transition:box-shadow .25s,transform .2s}
[data-glow]::before,[data-glow]::after{pointer-events:none;content:"";position:absolute;inset:calc(var(--border-size)*-1);border:var(--border-size) solid transparent;border-radius:inherit;background-attachment:fixed;background-size:calc(100% + 2*var(--border-size)) calc(100% + 2*var(--border-size));background-repeat:no-repeat;background-position:50% 50%;mask:linear-gradient(transparent,transparent),linear-gradient(white,white);mask-clip:padding-box,border-box;mask-composite:intersect;-webkit-mask:linear-gradient(transparent,transparent),linear-gradient(white,white);-webkit-mask-clip:padding-box,border-box;-webkit-mask-composite:destination-in}
[data-glow]::before{background-image:radial-gradient(calc(var(--spotlight-size)*.7) calc(var(--spotlight-size)*.7) at calc(var(--x,0)*1px) calc(var(--y,0)*1px),hsl(var(--hue) 80% 48% / .6),transparent 100%);filter:brightness(2)}
[data-glow]::after{background-image:radial-gradient(calc(var(--spotlight-size)*.42) calc(var(--spotlight-size)*.42) at calc(var(--x,0)*1px) calc(var(--y,0)*1px),hsl(0 0% 100% / .55),transparent 100%)}
.dark [data-glow]{background-image:radial-gradient(var(--spotlight-size) var(--spotlight-size) at calc(var(--x,0)*1px) calc(var(--y,0)*1px),hsl(var(--hue) 80% 62% / .15) 0%,transparent 78%)}
[data-glow-f]{--base:100;--spread:55}[data-glow-l]{--base:18;--spread:50}[data-glow-v]{--base:215;--spread:55}[data-glow-p]{--base:42;--spread:50}

/* ── Auth beam (static) ─────────────────────────────────────────────────── */
.auth-beam{position:absolute;z-index:10;pointer-events:none;border-radius:100px}
.auth-beam-top{top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(212,32,122,.65) 35%,rgba(200,139,10,.45) 65%,transparent);opacity:.8}
.auth-beam-right{top:0;right:0;bottom:0;width:1.5px;background:linear-gradient(180deg,transparent,rgba(200,139,10,.5) 50%,transparent);opacity:.6}
.auth-beam-bottom{bottom:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(196,82,26,.5) 50%,transparent);opacity:.6}
.auth-beam-left{top:0;left:0;bottom:0;width:1.5px;background:linear-gradient(180deg,transparent,rgba(212,32,122,.5) 50%,transparent);opacity:.6}
.auth-corner{position:absolute;z-index:11;pointer-events:none;width:7px;height:7px;border-radius:50%;filter:blur(1px)}
.auth-corner-tl{top:-1px;left:-1px;background:#D4207A;opacity:.75}
.auth-corner-tr{top:-1px;right:-1px;background:#C88B0A;opacity:.7}
.auth-corner-br{bottom:-1px;right:-1px;background:#C88B0A;opacity:.65}
.auth-corner-bl{bottom:-1px;left:-1px;background:#D4207A;opacity:.65}
.auth-btn-sweep{position:absolute;top:0;left:-100%;height:100%;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);pointer-events:none}

/* ── Theme toggle btn ─────────────────────────────────────────────────────── */


body:not(.dark) #_themeToggle{background:rgba(61,26,5,.45);border-color:rgba(61,26,5,.2);}
#_themeToggle:hover{transform:scale(1.12);}
</style>

<body>
<div id="root"></div>
<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────────
const API_BASE = window.location.origin;

const UF = {AC:"Acre",AL:"Alagoas",AM:"Amazonas",AP:"Amapá",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",MA:"Maranhão",MG:"Minas Gerais",MS:"Mato Grosso do Sul",MT:"Mato Grosso",PA:"Pará",PB:"Paraíba",PE:"Pernambuco",PI:"Piauí",PR:"Paraná",RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RO:"Rondônia",RR:"Roraima",RS:"Rio Grande do Sul",SC:"Santa Catarina",SE:"Sergipe",SP:"São Paulo",TO:"Tocantins"};

// ─── TRILHA DE SIMULADOS ─────────────────────────────────────────────────────
const SIMULADOS = [{"id": 1, "titulo": "Teorias Educacionais", "questoes": [{"q": "Para Jean Piaget, o desenvolvimento cognitivo ocorre por meio de processos de assimilação e acomodação, sendo esse equilíbrio denominado:", "op": ["Zona de desenvolvimento proximal", "Equilibração", "Mediação simbólica", "Internalização"], "c": 1, "b": "CEBRASPE", "e": "Equilibração é o processo de busca de reorganização cognitiva entre assimilação e acomodação.", "id": "m1_0"}, {"q": "Em Vygotsky, a distância entre o que a criança realiza sozinha e o que realiza com auxílio de um mediador mais experiente é chamada de:", "op": ["Zona de desenvolvimento real", "Zona de desenvolvimento proximal", "Estágio operatório concreto", "Assimilação recíproca"], "c": 1, "b": "FGV", "e": "Conceito central da teoria sociointeracionista de Vygotsky.", "id": "m1_1"}, {"q": "O behaviorismo skinneriano, aplicado à educação, fundamenta-se principalmente:", "op": ["No condicionamento operante e no reforço do comportamento", "Na construção espontânea do conhecimento", "Na conscientização crítica da realidade", "Nos estágios de desenvolvimento afetivo"], "c": 0, "b": "FCC", "e": "", "id": "m1_2"}, {"q": "Henri Wallon destacou-se por incluir, em sua teoria psicogenética, a dimensão:", "op": ["Exclusivamente cognitiva", "Afetivo-emocional integrada ao desenvolvimento", "Puramente comportamental", "Exclusivamente biológica, sem influência social"], "c": 1, "b": "VUNESP", "e": "", "id": "m1_3"}, {"q": "Para Piaget, no estágio sensório-motor (0-2 anos aproximadamente), a criança organiza o mundo principalmente por meio de:", "op": ["Operações lógico-formais", "Esquemas de ação e percepção", "Pensamento hipotético-dedutivo", "Linguagem escrita"], "c": 1, "b": "CEBRASPE", "e": "", "id": "m1_4"}, {"q": "Na perspectiva de Vygotsky, os instrumentos e signos culturais (como a linguagem) atuam como:", "op": ["Mediadores da relação do sujeito com o mundo", "Obstáculos ao desenvolvimento espontâneo", "Elementos irreleva  "b": "CEBRASPE", "e": "", "id": "m12_5"}, {"q": "A implementação da BNCC exige dos sistemas de ensino:", "op": ["A revisão dos currículos e a formação continuada de professores", "A manutenção inalterada dos currículos anteriores", "A exclusão da participação docente no processo", "A eliminação do PPP"], "c": 0, "b": "FCC", "e": "", "id": "m12_6"}, {"q": "A BNCC define como uma de suas competências gerais o pensamento científico, crítico e criativo, que envolve:", "op": ["Investigar causas, elaborar e testar hipóteses e formular conclusões com base em evidências", "Memorizar fórmulas sem qualquer aplicação prática", "Aceitar informações sem qualquer análise crítica", "Restringir-se a conteúdos das Ciências da Natureza, exclusivamente"], "c": 0, "b": "INDEPAC", "e": "", "id": "m12_7"}, {"q": "A BNCC do Ensino Fundamental prevê, na área de Linguagens, a articulação entre:", "op": ["Língua Portuguesa, Arte, Educação Física e Língua Inglesa", "Exclusivamente Língua Portuguesa e Matemática", "Apenas Educação Física, isoladamente", "Somente Arte e Ciências"], "c": 0, "b": "NOSSO RUMO", "e": "", "id": "m12_8"}, {"q": "Um dos objetivos da BNCC é reduzir as desigualdades educacionais ao definir:", "op": ["Aprendizagens essenciais comuns, que devem ser garantidas a todos os estudantes brasileiros", "Currículos exclusivos para regiões metropolitanas", "Conteúdos facultativos, a critério de cada rede", "Padrões distintos de aprendizagem por região"], "c": 0, "b": "IGEDUC", "e": "", "id": "m12_9"}]}, {"id": 13, "titulo": "Fundamentos Legais", "questoes": [{"q": "A Constituição Federal de 1988 estabelece a educação como:", "op": ["Direito de todos e dever do Estado e da família", "Responsabilidade exclusiva do Estado, sem participação da família", "Serviço facultativo, sem caráter de direito", "Dever exclusivo da iniciativa privada"], "c": 0, "b": "CEBRASPE", "e": "", "id": "m13_0"}, {"q": "Segundo a LDB, a Educação Básica é organizada nas etapas:", "op": ["Educação Infantil, En function simShuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function simGetBest(id){try{var v=localStorage.getItem('psim_b_'+id);return v!==null?parseInt(v):null;}catch(e){return null;}}
function simSetBest(id,v){try{localStorage.setItem('psim_b_'+id,String(v));}catch(e){}}
function simGetHist(id){try{return JSON.parse(localStorage.getItem('psim_h_'+id)||'[]')}catch(e){return[];}}
function simSetHist(id,h){try{localStorage.setItem('psim_h_'+id,JSON.stringify(h));}catch(e){}}
function simGetUsed(id,b){try{return JSON.parse(localStorage.getItem('psim_u_'+id+'_'+b)||'[]')}catch(e){return[];}}
function simSetUsed(id,b,u){try{localStorage.setItem('psim_u_'+id+'_'+b,JSON.stringify(u));}catch(e){}}

// Approximate hue from banca hex color for glow
function bancaHue(hex){
  var r=parseInt(hex.slice(1,3),16)/255;
  var g=parseInt(hex.slice(3,5),16)/255;
  var b=parseInt(hex.slice(5,7),16)/255;
  var max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0;
  if(d){if(max===r)h=(g-b)/d%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;}
  return h;
}

async function api(path,opts){
  opts=opts||{};
  const res=await fetch(API_BASE+'/api/'+path,{
    headers:Object.assign({'Content-Type':'application/json'},opts.headers||{}),
    method:opts.method||'GET',
    body:opts.body?JSON.stringify(opts.body):undefined
  });
  return res.json();
}

async function registerUser(nome,email,senha,uf){
  const r=await api('register',{method:'POST',body:{nome,email,senha,uf}});
  if(r.error)return{ok:false,msg:r.error};
  return{ok:true,user:r.user};
}

  return{ok:true,user:r.user};
}

async function loadConcursos(uf){
  setState({cLoading:true,concursos:[]});
  try{
    const estado=UF[uf];
    const res=await fetch(API_BASE+'/api/buscar-concursos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uf,estado})});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const editais=data.editais||[];
    if(editais.length===0)throw new Error('vazio');
    const fmt=d=>d.toLocaleDateString('pt-BR');
    const atuEm=data.atualizado_em?new Date(data.atualizado_em):new Date();
    const proxima=new Date(atuEm);proxima.setDate(proxima.getDate()+15);
    setState({concursos:editais,cFonte:data.fonte||'live',cLoading:false,cAtualizado:fmt(atuEm),cProxima:fmt(proxima)});
    showToast(editais.length+' concursos encontrados! 🎯');
  }catch(e){
    setState({concursos:getConcursosBase(uf),cFonte:'base',cLoading:false});
  }
}

function applyTheme(t){

  try{ localStorage.setItem('podpro-theme', t); }catch(e){}

// ── applyGlow: stamps data-glow on every .card after render ─────────────
function applyGlow(){
  // All generic cards get base pink glow
  document.querySelectorAll('.card:not([data-glow])').forEach(function(el){
    el.setAttribute('data-glow','');
  });
  // Plan-specific hues on planos screen
  var planHues={f:100,l:18,v:215,p:42};
  Object.entries(planHues).forEach(function(entry){
    var letter=entry[0],hue=entry[1];
    document.querySelectorAll('[data-glow-'+letter+']').forEach(function(el){
      el.style.setProperty('--base',hue);
      el.style.setProperty('--spread',55);
      if(!el.hasAttribute('data-glow'))el.setAttribute('data-glow','');
    });
  });
  // Auth card — subtle warm glow
  var authCard=document.querySelector('.screen .card');
  if(authCard&&state.scr==='auth'){authCard.style.setProperty('--spread','50');authCard.style.setProperty('--base','335');}
}

// ── Global glow pointer tracker (runs once) ─────────────────────────────
(function initGlow(){
  document.addEventListener('pointermove',function(e){
    var xp=(e.clientX/window.innerWidth).toFixed(3);
    var yp=(e.clientY/window.innerHeight).toFixed(3);
    document.querySelectorAll('[data-glow]').forEach(function(el){
      el.style.setProperty('--x',e.clientX.toFixed(1));
      el.style.setProperty('--y',e.clientY.toFixed(1));
      el.style.setProperty('--xp',xp);
      el.style.setProperty('--yp',yp);
    });
  },{passive:true});
})();

        +'position:relative;border-radius:20px;padding:22px 12px 18px;text-align:center;'
        +'cursor:pointer;font-family:Nunito,sans-serif;'
        +(locked?'':'box-shadow:0 6px 24px '+c.color+'45;')
        +'transition:transform .2s,box-shadow .2s">'
        +(locked?'<div style="position:absolute;top:6px;right:6px;background:'+pc.cor+';color:#fff;border-radius:8px;padding:2px 6px;font-size:8px;font-weight:900">'+pc.nome.slice(0,3).toUpperCase()+'</div>':'')
        +'<div style="font-size:28px;margin-bottom:9px;'+(locked?'opacity:.3':'filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))')+'">'+c.ic+'</div>'
        +'<div style="font-size:13px;font-weight:900;color:'+(locked?'var(--text-muted)':'rgba(255,255,255,.95)')+'">'+c.lb+'</div>'
        +'<div style="font-size:11px;color:'+(locked?'var(--text-muted)':'rgba(255,255,255,.75)')+';margin-top:3px;line-height:1.3">'+c.sub+'</div>'
      +'</button>';
    }).join("")
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
      +'<div style="width:4px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--pink),#C88B0A)"></div>'
      +'<h3 style="font-weight:900;color:var(--text);font-size:16px">Últimos editais</h3>'
      +(state.concursos.length?'<span class="chip">'+state.concursos.length+'</span>':'')
    +'</div>'
    +(hasAccess('libaneo')
      ?(state.cLoading
        ?'<div style="text-align:center;padding:32px 0"><div class="loader spin" style="margin:0 auto"></div></div>'
        :'<div style="display:flex;flex-direction:column;gap:10px">'+state.concursos.slice(0,3).map((v,i)=>
          '<button class="btn card" data-vaga="'+i+'" style="padding:16px;text-align:left;width:100%">'
            +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="flex:1"><p style="font-weight:800;font-size:14px;line-height:1.4;color:var(--text)">'+v.cargo+'</p><p style="color:var(--text-muted);font-size:12px;margin-top:3px">📍 '+v.cidade+'</p></div>'+statusTag(v.status)+'</div>'
            +'<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+chip(v.banca?"🏦 "+v.banca:"")+chip(v.vagas?"👥 "+v.vagas:"")+chip(v.salario?"💰 "+v.salario:"")+'</div>'
          +'</button>').join("")+'</div>')
      :'<div class="card" style="padding:28px;text-align:center;border:2px dashed rgba(196,82,26,.25);background:linear-gradient(145deg,rgba(196,82,26,.07),rgba(212,32,122,.04))">'
        +'<div style="font-size:44px;margin-bottom:12px">📡</div>'
        +'<p style="font-weight:900;color:var(--text);margin-bottom:6px;font-size:16px">Radar dos Concursos</p>'
        +'<p style="color:var(--text-muted);font-size:13px;margin-bottom:18px;line-height:1.6">Acompanhe editais do seu estado em tempo real</p>'
        +'<button class="btn btn-pink" id="btnUpgradeLibaneo" style="padding:13px 26px;font-size:14px">Assinar Libâneo – R$ 7,97/mês</button>'
      +'</div>'
    )
  +'</div>'+renderNav("home");
}

function renderQuizMenu(){
  return'<div class="screen fade-up">'
    +'<div style="margin-bottom:20px">'
      +'<h2 style="font-size:26px;font-weight:900;background:linear-gradient(120deg,var(--text) 20%,#1B3A6B 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">🧠 Quiz por Banca</h2>'

      +'<p style="font-weight:900;font-size:13px;margin-bottom:10px;color:var(--text)">📊 Últimos resultados</p>'
      +state.qHistory.slice(0,3).map((h,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;'+(i<2?'border-bottom:1px solid var(--border)':'')+'">'
        +'<span style="font-size:13px;font-weight:700;color:var(--text)">🏦 '+h.banca+'</span>'
        +'<div style="display:flex;align-items:center;gap:8px">'
          +'<div style="background:'+(h.score/h.total>=.7?'rgba(22,163,74,.15)':'rgba(217,119,6,.15)')+';color:'+(h.score/h.total>=.7?'#16a34a':'#D97706')+';border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800">'+h.score+'/'+h.total+'</div>'
          +'<span style="color:var(--text-muted);font-size:11px">'+h.data+'</span>'
        +'</div>'
      +'</div>').join("")
    +'</div>':"")

    +'<div style="display:flex;flex-direction:column;gap:12px">'
    +Object.entries(QUIZ_BANCAS).map(([key,b])=>{
      const bestScore=state.qHistory.filter(h=>h.banca===key);
      const best=bestScore.length?Math.max(...bestScore.map(h=>Math.round(h.score/h.total*100))):null;
      return'<button class="btn" data-banca="'+key+'" style="'
        +'padding:18px;text-align:left;width:100%;border-radius:20px;'
        +'background:linear-gradient(145deg,'+b.cor+'18,'+b.cor+'05);'
        +'border:1.5px solid '+b.cor+'28;'
        +'box-shadow:0 4px 20px '+b.cor+'15;'
        +'backdrop-filter:blur(10px);font-family:Nunito,sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s">'
        +'<div style="display:flex;align-items:center;gap:14px">'
          +'<div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,'+b.cor+','+b.cor+'AA);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:0 6px 20px '+b.cor+'45;flex-shrink:0">'+key.slice(0,2)+'</div>'
          +'<div style="flex:1">'
            +'<p style="font-weight:900;font-size:16px;color:var(--text)">'+key+'</p>'
            +'<p style="color:var(--text-muted);font-size:12px;margin-top:2px;line-height:1.4">'+b.descricao+'</p>'
          +'</div>'
          +'<div style="text-align:right;flex-shrink:0">'
            +'<p style="color:'+b.cor+';font-weight:900;font-size:22px;line-height:1">'+b.questoes.length+'</p>'
            +'<p style="color:var(--text-muted);font-size:10px">questões</p>'
            +(best!==null?'<p style="color:'+(best>=70?'#16a34a':'#D97706')+';font-size:11px;font-weight:800;margin-top:3px">melhor '+best+'%</p>':'')
          +'</div>'
        +'</div>'
        +'<div style="height:3px;border-radius:4px;background:linear-gradient(90deg,'+b.cor+'60,'+b.cor+'20,transparent);margin-top:14px"></div>'
      +'</button>';
    }).join("")
    +'</div>'
  +'</div>'+renderNav("quiz");
}

function renderPlanos(){
  const current=state.plano||'ferreiro';
  const planOrder=['ferreiro','libaneo','vygotsky','piaget'];
  const planLabels={ferreiro:'Comece grátis',libaneo:'Assinar',vygotsky:'Assinar',piaget:'Assinar'};

  // Feature rows per card
  function buildFeatures(key){
    const p=PLANOS[key];
    return FEATURES.map(f=>{
      const access=(PLANOS[f.plano]?.nivel??0)<=(p.nivel??0);
      return'<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">'
        +'<span style="flex-shrink:0;font-size:15px;font-weight:900;color:'+(access?p.check:'rgba(61,26,5,.2)')+';">'+(access?'✓':'—')+'</span>'
        +'<span style="font-size:13px;font-weight:600;line-height:1.4;color:'+(access?'#3D1A05':'rgba(61,26,5,.35)')+'">'+f.lb+'</span>'
      +'</div>';
    }).join('');
  }

  const cards=planOrder.map(key=>{
    const p=PLANOS[key];
    const ativo=current===key;
    const isVyg=key==='vygotsky';
    const glowAttr='data-glow data-glow-'+key.charAt(0);

    // CTA
    const cta=ativo
      ?'<div style="background:'+p.cor+'18;border:1.5px solid '+p.cor+';border-radius:12px;padding:11px;text-align:center;margin-top:14px"><p style="font-weight:800;font-size:13px;color:'+p.cor+'">✓ Seu plano atual</p></div>'
      :key==='ferreiro'
        ?'<div style="background:'+p.cor+'12;border-radius:12px;padding:11px;text-align:center;margin-top:14px"><p style="font-size:12px;color:'+p.cor+';font-weight:700">Gratuito para todos</p></div>'
        :'<button class="btn" data-upgplano="'+key+'" style="width:100%;padding:13px;font-size:14px;background:'+p.cor+';color:#fff;border-radius:12px;margin-top:14px;font-weight:800">Assinar '+p.nome+' · R$ '+p.preco.toFixed(2).replace('.',',')+'/mês</button>';

    return'<div '+glowAttr+' class="card" style="border-radius:20px;overflow:hidden;border:'+(isVyg?'2.5px solid '+p.cor+';box-shadow:0 6px 28px '+p.cor+'28':'1.5px solid rgba(61,26,5,.1)')+';">'
      // ── Header ──
      +'<div style="background:'+p.cor+';padding:18px 18px 14px;position:relative">'
        +(isVyg?'<div style="position:absolute;top:10px;right:12px;background:rgba(255,255,255,.22);border-radius:20px;padding:2px 10px;font-size:10px;font-weight:800;color:#fff;letter-spacing:.5px">⭐ MAIS POPULAR</div>':'')
        +'<div style="display:flex;align-items:center;gap:12px">'
          +'<span style="font-size:32px">'+p.emoji+'</span>'
          +'<div>'
            +'<p style="color:#fff;font-weight:900;font-size:17px;letter-spacing:.3px">'+p.nome.toUpperCase()+'</p>'
            +(key==='ferreiro'
              ?'<p style="color:rgba(255,255,255,.85);font-size:22px;font-weight:900;margin-top:2px">R$ 0,00</p>'
              :'<p style="color:#fff;font-size:22px;font-weight:900;margin-top:2px">R$ '+p.preco.toFixed(2).replace('.',',')+' <span style="font-size:12px;font-weight:600;opacity:.8">/mês</span></p>'
            )
          +'</div>'
        +'</div>'
      +'</div>'
      // ── Features ──
      +'<div style="padding:14px 16px">'
        +buildFeatures(key)
        +cta
      +'</div>'
    +'</div>';
  }).join('');

  return'<div class="screen fade-up">'
    +'<div style="text-align:center;margin-bottom:20px">'
      +'<h2 style="font-size:26px;font-weight:900;color:#3D1A05">Planos de Assinatura</h2>'
      +'<p style="color:var(--text-sec);font-size:13px;margin-top:6px;line-height:1.5">Sua preparação para concursos de <b style="color:var(--pink)">Pedagogia</b> em um só lugar</p>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:14px">'
      +cards
    +'</div>'
  +'</div>'+renderNav("planos");
}

)[0]:null;const thumb=ytId?"https://img.youtube.com/vi/"+ytId+"/default.jpg":null;return'<div class="card" style="padding:14px;display:flex;gap:12px;align-items:center">'+(thumb?'<img src="'+thumb+'" style="width:60px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0"/>':"")+'<div style="flex:1;min-width:0"><p style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3D1A05">'+v.titulo+'</p><div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">'+chip(v.banca?"🏦 "+v.banca:"")+chip(v.disciplina?"📚 "+v.disciplina:"")+'<span style="background:'+(v.ativo?"rgba(22,163,74,.1)":"rgba(220,38,38,.1)")+'";color:'+(v.ativo?"#16a34a":"#c0392b")+'border-radius:8px;padding:2px 8px;font-size:10px;font-weight:700">'+(v.ativo?"✓ Ativo":"✕ Inativo")+'</span></div></div><div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0"><button class="btn btn-ghost" data-admtoggle="'+v.id+'" data-admativo="'+v.ativo+'" style="padding:4px 10px;font-size:11px;border-radius:12px;color:#3D1A05">'+(v.ativo?"Pausar":"Ativar")+'</button><button class="btn btn-danger" data-admdel="'+v.id+'" style="padding:4px 10px;font-size:11px;border-radius:12px">🗑</button></div></div>';}).join("")+'</div></div>';
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
async function handleAuth(){
  const nome=document.getElementById("aNome")?document.getElementById("aNome").value:"";
  const email=document.getElementById("aEmail")?document.getElementById("aEmail").value:"";
  const senha=document.getElementById("aSenha")?document.getElementById("aSenha").value:"";
  const ufEl=document.getElementById("aUf");
  const uf=ufEl?ufEl.value:"SP";
  if(!email||!senha){showToast("Preencha todos os campos","e");return;}
  if(state.aMode==="register"&&!nome){showToast("Informe seu nome","e");return;}
  setState({aLoading:true});
  if(state.aMode==="register"){
    const r=await registerUser(nome,email,senha,uf);
    if(!r.ok){showToast(r.msg,"e");setState({aLoading:false});return;}
    showToast("Conta criada! Bem-vinda! 🎓");
    const plano=r.user.plano||'ferreiro';
    setState({user:r.user,plano,scr:"home",aLoading:false});
    loadUserData(r.user);
  }else{
    const r=await loginUser(email,senha);
    if(!r.ok){showToast(r.msg,"e");setState({aLoading:false});return;}
    showToast("Olá, "+r.user.nome+"! 👋");
    const plano=r.user.plano||'ferreiro';
    setState({user:r.user,plano,scr:"home",aLoading:false});
    loadUserData(r.user);
  }
}

async function loadUserData(user){
  const [tasks,qHistory]=await Promise.all([loadTasksAPI(user.id),loadQuizHistoryAPI(user.id)]);
  setState({tasks,qHistory});
  if(hasAccess('libaneo'))loadConcursos(user.uf);
  setState({eLoading:true});loadEbooksAPI().then(ebooks=>setState({ebooks,eLoading:false}));
  const params=new URLSearchParams(window.location.search);
  if(params.get('assinatura')==='sucesso'){
    showToast('Pagamento confirmado! Plano ativo! 🎉');
    window.history.replaceState({},'',window.location.pathname);
  }
}

function navTo(scr){
  if(scr==="videoaulas"){
    if(!hasAccess('piaget')){setState({upgModal:true,upgPlano:'piaget'});return;}
    setState({scr:"videoaulas",selVaga:null,selVideoaula:null,vLoading:true});
    loadVideoaulasAPI().then(videoaulas=>setState({videoaulas,vLoading:false}));
    return;
  }
  if(scr==="simulados"){
    setState({scr:"simulados",simQuiz:null,simDone:false});
    return;
  }
  if(scr==="ebooks"){
    setState({scr:"ebooks",selEbook:null,eLoading:true});
    loadEbooksAPI().then(ebooks=>setState({ebooks,eLoading:false}));
    return;
  }
  if(scr==="vagas"){
    if(!hasAccess('libaneo')){setState({scr:"vagas"});return;}
    setState({scr:"vagas",selVaga:null,selVideoaula:null});
    if(state.concursos.length===0&&!state.cLoading&&state.user)loadConcursos(state.user.uf);
    return;
  }
  setState({scr,selVaga:null,selVideoaula:null});
}

async function iniciarQuiz(banca){setState({bancaSel:banca,qIdx:0,qAns:null,qScore:0,qDone:false,scr:"quiz_jogo"});}

async function responder(idx){
  if(state.qAns!==null)return;
  const questoes=QUIZ_BANCAS[state.bancaSel].questoes;
  const correta=questoes[state.qIdx].r===idx;
  const novoScore=correta?state.qScore+1:state.qScore;
  setState({qAns:idx,qScore:novoScore});
  setTimeout(async()=>{
    if(state.qIdx+1<questoes.length){setState({qIdx:state.qIdx+1,qAns:null});}
    else{
      const novoH={banca:state.bancaSel,score:novoScore,total:questoes.length,data:new Date().toLocaleDateString("pt-BR")};
      const hist=[novoH,...state.qHistory].slice(0,20);
      await saveQuizResultAPI(state.user.id,state.bancaSel,novoScore,questoes.length);
      setState({qDone:true,qHistory:hist});
    }
  },1100);
}

// ─── BIND EVENTS ─────────────────────────────────────────────────────────────
function bindEvents(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);};

  // ── Auth: 3D tilt on mouse move ─────────────────────────────────────────
  (function setup3DTilt(){
    var wrap=document.getElementById('auth3dWrap');
    var card=document.getElementById('authCardContainer');
    if(!wrap||!card)return;
    wrap.addEventListener('mousemove',function(e){
      var r=wrap.getBoundingClientRect();
      var dx=(e.clientX-r.left-r.width/2)/(r.width/2);
      var dy=(e.clientY-r.top-r.height/2)/(r.height/2);
      card.style.transition='transform .06s ease';
      card.style.transform='perspective(900px) rotateX('+(-dy*7)+'deg) rotateY('+(dx*7)+'deg)';
    },{passive:true});
    wrap.addEventListener('mouseleave',function(){
      card.style.transition='transform .55s ease';
      card.style.transform='perspective(900px) rotateX(0deg) rotateY(0deg)';
    });
  })();

  // ── Auth: password toggle ─────────────────────────────────────────────────
  on("btnTogglePwd","click",function(){
    var inp=document.getElementById('aSenha');
    if(!inp)return;
    var show=inp.type==='password';
    inp.type=show?'text':'password';
    setState({_showPwd:show});
  });

  on("authTabLogin","click",()=>setState({aMode:"login",_showPwd:false}));
  on("authTabReg","click",()=>setState({aMode:"register",_showPwd:false}));
  on("authSwitch","click",()=>setState({aMode:"register"}));
  on("authSwitch2","click",()=>setState({aMode:"login"}));
  on("btnAuth","click",handleAuth);
  on("aSenha","keydown",e=>{if(e.key==="Enter")handleAuth();});

  on("btnUpgOk","click",async()=>{
    const plano=state.upgPlano||'libaneo';
    const p=PLANOS[plano];
    if(state.user){const ok=await assinarPlano(state.user.id,state.user.email,state.user.nome,plano,p.preco);if(!ok)showToast("Erro ao abrir pagamento.","e");}
    setState({upgModal:false});
  });
  on("btnUpgX","click",()=>setState({upgModal:false,scr:"planos"}));
  const ov=document.getElementById("upgOverlay");
  if(ov)ov.addEventListener("click",e=>{if(e.target.id==="upgOverlay")setState({upgModal:false});});

  document.querySelectorAll("[data-nav]").forEach(btn=>btn.addEventListener("click",()=>navTo(btn.dataset.nav)));
  on("btnPlanoBadge","click",()=>setState({scr:"planos"}));
  on("btnVerPlanos","click",()=>setState({scr:"planos"}));
  on("btnUpgradeLibaneo","click",()=>{setState({upgModal:true,upgPlano:'libaneo'});});
  on("btnUpgLibaneo","click",()=>setState({scr:"planos"}));
  on("btnUpgPiaget","click",()=>{setState({upgModal:true,upgPlano:'piaget'});});

  // Planos page - subscribe buttons
  document.querySelectorAll("[data-upgplano]").forEach(btn=>btn.addEventListener("click",async()=>{
    const plano=btn.dataset.upgplano;
    const p=PLANOS[plano];
    if(state.user){
      const ok=await assinarPlano(state.user.id,state.user.email,state.user.nome,plano,p.preco);
      if(!ok)showToast("Erro ao abrir pagamento.","e");
    }
  }));

  on("btnHomeRefresh","click",()=>{if(!state.cLoading&&state.user)loadConcursos(state.user.uf);});
  document.querySelectorAll("[data-vaga]").forEach(btn=>btn.addEventListener("click",()=>setState({selVaga:state.concursos[parseInt(btn.dataset.vaga)],scr:"vagas"})));
  on("btnVagaBack","click",()=>setState({selVaga:null}));
  on("btnVagasRefresh","click",()=>{if(!state.cLoading&&state.user)loadConcursos(state.user.uf);});
  document.querySelectorAll("[data-vagaidx]").forEach(btn=>btn.addEventListener("click",()=>setState({selVaga:state.concursos[parseInt(btn.dataset.vagaidx)]})));

  document.querySelectorAll("[data-banca]").forEach(btn=>btn.addEventListener("click",()=>iniciarQuiz(btn.dataset.banca)));
  on("btnQuizSair","click",()=>setState({scr:"quiz",bancaSel:null}));
  on("btnQuizRefaz","click",()=>iniciarQuiz(state.bancaSel));
  on("btnQuizOutras","click",()=>setState({scr:"quiz",bancaSel:null}));
  document.querySelectorAll("[data-opt]").forEach(btn=>btn.addEventListener("click",()=>responder(parseInt(btn.dataset.opt))));

  on("btnVABack","click",()=>setState({selVideoaula:null}));
  document.querySelectorAll("[data-va]").forEach(btn=>btn.addEventListener("click",()=>setState({selVideoaula:state.videoaulas[parseInt(btn.dataset.va)]})));

  on("btnAddTask","click",async()=>{
    const val=$("novaTask")?$("novaTask").value.trim():"";
    if(!val)return;
    const nova=await addTaskAPI(state.user.id,val);
    if(nova){setState({tasks:[...state.tasks,nova]});showToast("Tarefa adicionada! ✅");}
  });
  on("novaTask","keydown",async e=>{
    if(e.key==="Enter"){const val=e.target.value.trim();if(!val)return;const nova=await addTaskAPI(state.user.id,val);if(nova){setState({tasks:[...state.tasks,nova]});showToast("Tarefa adicionada! ✅");}}
  });
  document.querySelectorAll("[data-filtro]").forEach(btn=>btn.addEventListener("click",()=>setState({filtroTask:btn.dataset.filtro})));
  document.querySelectorAll("[data-taskid]").forEach(btn=>btn.addEventListener("click",async()=>{
    const task=state.tasks.find(t=>t.id===btn.dataset.taskid);
    if(!task)return;
    const novas=state.tasks.map(t=>t.id===btn.dataset.taskid?{...t,feita:!t.feita}:t);
    await toggleTaskAPI(state.user.id,btn.dataset.taskid,!task.feita);
    setState({tasks:novas});
  }));
  document.querySelectorAll("[data-deltask]").forEach(btn=>btn.addEventListener("click",async()=>{
    await deleteTaskAPI(state.user.id,btn.dataset.deltask);
    setState({tasks:state.tasks.filter(t=>t.id!==btn.dataset.deltask)});
    showToast("Tarefa removida");
  }));
  on("btnClearDone","click",async()=>{
    const qtd=state.tasks.filter(t=>t.feita).length;
    await clearDoneTasksAPI(state.user.id);
    setState({tasks:state.tasks.filter(t=>!t.feita)});
    showToast(qtd+" tarefa(s) removida(s)");
  });

  on("perfilUf","change",async e=>{
    const novoUf=e.target.value;
    setState({user:{...state.user,uf:novoUf}});
    if(hasAccess('libaneo'))loadConcursos(novoUf);
    showToast("Monitorando "+UF[novoUf]+"! 📡");
  });
  on("btnThemePerfil","click",()=>setState({theme:state.theme==="dark"?"light":"dark"}));
  on("_themeToggle","click",()=>setState({theme:state.theme==="dark"?"light":"dark"}));
  on("btnLogout","click",()=>setState({user:null,scr:"auth",aMode:"login",concursos:[],tasks:[],qHistory:[],cFonte:"",selVaga:null,plano:"ferreiro"}));
  on("btnUpgVygotsky","click",()=>{setState({upgModal:true,upgPlano:'vygotsky'});});
  on("btnEbookBack","click",()=>setState({selEbook:null}));
  document.querySelectorAll("[data-ebidx]").forEach(btn=>btn.addEventListener("click",()=>setState({selEbook:state.ebooks[parseInt(btn.dataset.ebidx)]})));

  // ADM ebooks
  on("btnAdmAddEB","click",async()=>{
    const titulo=document.getElementById("ebTitulo")?document.getElementById("ebTitulo").value.trim():"";
    const descricao=document.getElementById("ebDesc")?document.getElementById("ebDesc").value.trim():"";
    const categoria=document.getElementById("ebCategoria")?document.getElementById("ebCategoria").value:"geral";
    const conteudo=document.getElementById("ebConteudo")?document.getElementById("ebConteudo").value.trim():"";
    const pdf_url=document.getElementById("ebPdfUrl")?document.getElementById("ebPdfUrl").value.trim():"";
    const ordem=document.getElementById("ebOrdem")?document.getElementById("ebOrdem").value:"0";
    if(!titulo){showToast("Título obrigatório","e");return;}
    if(!conteudo&&!pdf_url){showToast("Informe o texto ou a URL do PDF","e");return;}
    setState({eLoading:true});
    const r=await addEbookAPI(state.admPass,{titulo,descricao,categoria,conteudo,pdf_url,ordem});
    if(r.error){showToast(r.error,"e");setState({eLoading:false});return;}
    const ebs=await loadEbooksAPI();
    setState({ebooks:ebs,eLoading:false});
    showToast("E-book adicionado! 📚");
  });
  document.querySelectorAll("[data-ebtogg]").forEach(btn=>btn.addEventListener("click",async()=>{
    const ativo=btn.dataset.ebativo==="true";
    await toggleEbookAPI(state.admPass,btn.dataset.ebtogg,!ativo);
    const ebs=await loadEbooksAPI();setState({ebooks:ebs});
  }));
  document.querySelectorAll("[data-ebdel]").forEach(btn=>btn.addEventListener("click",async()=>{
    if(!confirm("Remover este e-book?"))return;
    await deleteEbookAPI(state.admPass,btn.dataset.ebdel);
    const ebs=await loadEbooksAPI();setState({ebooks:ebs});
    showToast("E-book removido");
  }));

  on("btnAdmAccess","click",()=>setState({scr:"adm",admAuthed:false,admPass:""}));

  on("btnAdmLogin","click",async()=>{
    const pass=$("admPassInput")?$("admPassInput").value:"";
    const r=await api('videoaulas',{method:'GET'});
    if(r.error){showToast("Erro de conexão","e");return;}
    const test=await fetch(API_BASE+'/api/videoaulas',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({titulo:"_test_",youtube_url:"https://youtu.be/dQw4w9WgXcQ"})});
    const testR=await test.json();
    if(testR.error&&testR.error.toLowerCase().includes("senha")){showToast("Senha incorreta","e");return;}
    if(testR.videoaula)await api('videoaulas',{method:'DELETE',headers:{'x-admin-password':pass},body:{id:testR.videoaula.id}});
    setState({admAuthed:true,admPass:pass,vLoading:true});
    const vas=await loadVideoaulasAPI();
    setState({videoaulas:vas,vLoading:false});
  });
  on("admPassInput","keydown",e=>{if(e.key==="Enter")document.getElementById("btnAdmLogin")&&document.getElementById("btnAdmLogin").click();});
  on("btnAdmBack","click",()=>setState({scr:"perfil",admAuthed:false}));

  on("btnAdmAddVA","click",async()=>{
    const titulo=$("vaTitulo")?$("vaTitulo").value.trim():"";
    const youtube_url=$("vaUrl")?$("vaUrl").value.trim():"";
    const descricao=$("vaDesc")?$("vaDesc").value.trim():"";
    const banca=$("vaBanca")?$("vaBanca").value:"";
    const disciplina=$("vaDisciplina")?$("vaDisciplina").value:"";
    const ordem=parseInt($("vaOrdem")?$("vaOrdem").value:0)||0;
    if(!titulo||!youtube_url){showToast("Título e URL são obrigatórios","e");return;}
    setState({vLoading:true});
    const r=await addVideoaulaAPI(state.admPass,{titulo,descricao,youtube_url,banca,disciplina,ordem});
    if(r.error){showToast(r.error,"e");setState({vLoading:false});return;}
    const vas=await loadVideoaulasAPI();
    setState({videoaulas:vas,vLoading:false});
    showToast("Videoaula adicionada! 🎬");
  });

  document.querySelectorAll("[data-admtoggle]").forEach(btn=>btn.addEventListener("click",async()=>{
    const ativo=btn.dataset.admativo==="true";
    setState({vLoading:true});
    await toggleVideoaulaAPI(state.admPass,btn.dataset.admtoggle,!ativo);
    const vas=await loadVideoaulasAPI();
    setState({videoaulas:vas,vLoading:false});
  }));
  document.querySelectorAll("[data-admdel]").forEach(btn=>btn.addEventListener("click",async()=>{
    if(!confirm("Remover esta videoaula?"))return;
    setState({vLoading:true});
    await deleteVideoaulaAPI(state.admPass,btn.dataset.admdel);
    const vas=await loadVideoaulasAPI();
    setState({videoaulas:vas,vLoading:false});
    showToast("Videoaula removida");
  }));
}
